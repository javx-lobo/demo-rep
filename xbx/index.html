<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal or No Deal JS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <h1>Deal or No Deal</h1>
  <div id="log" class="log"></div>
  <div id="prompt" class="prompt hidden">
    <span id="promptText"></span>
    <input id="promptInput" type="text" />
    <button id="promptOk" class="btn"><i class="fa fa-check"></i></button>
    <button id="promptYes" class="btn hidden">Yes</button>
    <button id="promptNo" class="btn hidden">No</button>
  </div>
  <button id="startBtn" class="btn"><i class="fa fa-play"></i> Start Game</button>
</div>
<script src="game.js"></script>
</body>
</html>
